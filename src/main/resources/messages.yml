prefix: "&8[&#E5484DpnRelog&8] "
combat-start: "{prefix}&cВы вошли в бой с &f{opponent}&c. Не выходите с сервера!"
combat-end: "{prefix}&aБоевой режим завершён."
command-blocked: "{prefix}&cЭта команда недоступна ещё &f{time}с&c."
player-command-blocked: "{prefix}&cНельзя использовать эту команду на &f{player}&c: игрок в бою."
teleport-blocked: "{prefix}&cТелепортация во время боя запрещена. Осталось &f{time}с&c."
elytra-blocked: "{prefix}&cЭлитры недоступны во время боя."
item-cooldown: "{prefix}&cПодождите &f{time}с &cперед использованием &f{item}&c."
item-cooldown-ended: "{prefix}&aПредмет &f{item} &aснова доступен."
item-held-cooldown: "{prefix}&7До готовности &f{item}&7: &c{time}с"
item-prevented: "{prefix}&cПредмет &f{item} &cнельзя использовать во время боя."
logout-broadcast: "{prefix}&f{player} &cвышел во время боя и получил наказание."
logout-forgiven: "{prefix}&aВы вернулись вовремя. Наказание отменено."
pending-penalty: "{prefix}&cЗа прошлый выход во время боя применено наказание."
no-permission: "{prefix}&cНедостаточно прав."
player-not-found: "{prefix}&cИгрок не найден."
not-in-combat: "{prefix}&a{player} не находится в бою."
status: "{prefix}&f{player}: &c{time}с&7, противники: &f{opponents}&7, урон &a{damage_dealt}&7/&c{damage_taken}"
history-empty: "{prefix}&7Записей по игроку {player} нет."
history-line: "&8- &7{time} &f{type}&7: {detail}"
cleared: "{prefix}&aБоевой режим снят с {player}."
cleared-all: "{prefix}&aВсе боевые сессии остановлены."
tagged: "{prefix}&aСоздан бой {player} против {opponent} на {time}с."
permit-granted: "{prefix}&aОдноразовый выход разрешён игроку {player} на {time}с."
copy-empty: "{prefix}&cВозьмите предмет в основную руку."
copy-value: "{prefix}&7Base64 предмета: &f{value}"
update-found: "{prefix}&eДоступна версия &f{version}&e: &f{url}"
update-none: "{prefix}&aУстановлена актуальная версия {version}."
update-staged: "{prefix}&aОбновление сохранено в &f{file}&a. Перезапустите сервер."
update-error: "{prefix}&cОшибка обновления: {error}"
reloaded: "{prefix}&aКонфигурация pnRelog перезагружена."
reload-failed: "{prefix}&cКонфигурация не применена: {error}"
stats: "{prefix}&7Связей: &f{links}&7, игроков в бою: &f{players}&7, ожиданий: &f{pending}&7, circuit breaker: {circuit}"
circuit-opened: "{prefix}&eМассовый дисконнект: санкции временно приостановлены."
usage:
  - "&8&m----------&r &#E5484DpnRelog &8&m----------"
  - "&f/pnrelog status [игрок] &8- &7статус боя"
  - "&f/pnrelog stats &8- &7состояние системы"
  - "&f/pnrelog tag <1> <2> [сек] &8- &7начать бой"
  - "&f/pnrelog clear <игрок|all> &8- &7снять тег"
  - "&f/pnrelog permit <игрок> [сек] [причина] &8- &7разрешить переход"
  - "&f/pnrelog history <игрок> [лимит] &8- &7история решений"
  - "&f/pnrelog copy &8- &7получить Base64 предмета"
  - "&f/pnrelog update [check|install] &8- &7проверить/установить обновление"
  - "&f/pnrelog reload &8- &7перезагрузить конфиг"
