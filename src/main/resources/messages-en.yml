prefix: "&8[&#E5484DpnRelog&8] "
combat-start: "{prefix}&cYou entered combat with &f{opponent}&c. Do not disconnect!"
combat-end: "{prefix}&aCombat mode ended."
command-blocked: "{prefix}&cThis command is unavailable for another &f{time}s&c."
player-command-blocked: "{prefix}&cYou cannot use this command on &f{player}&c: the player is in combat."
teleport-blocked: "{prefix}&cTeleporting is blocked for another &f{time}s&c."
elytra-blocked: "{prefix}&cElytra is unavailable during combat."
item-cooldown: "{prefix}&cWait &f{time}s &cbefore using &f{item}&c."
item-cooldown-ended: "{prefix}&aItem &f{item} &ais ready again."
item-held-cooldown: "{prefix}&7Time until &f{item}&7 is ready: &c{time}s"
item-prevented: "{prefix}&cItem &f{item} &ccannot be used during combat."
logout-broadcast: "{prefix}&f{player} &clogged out during combat and was punished."
logout-forgiven: "{prefix}&aYou returned in time. The punishment was cancelled."
pending-penalty: "{prefix}&cA penalty for your previous combat logout was applied."
no-permission: "{prefix}&cYou do not have permission."
player-not-found: "{prefix}&cPlayer not found."
not-in-combat: "{prefix}&a{player} is not in combat."
status: "{prefix}&f{player}: &c{time}s&7, opponents: &f{opponents}&7, damage &a{damage_dealt}&7/&c{damage_taken}"
history-empty: "{prefix}&7No records found for {player}."
history-line: "&8- &7{time} &f{type}&7: {detail}"
cleared: "{prefix}&aCombat mode cleared for {player}."
cleared-all: "{prefix}&aAll combat sessions were stopped."
tagged: "{prefix}&aStarted combat {player} vs {opponent} for {time}s."
permit-granted: "{prefix}&aGranted {player} a one-time logout permit for {time}s."
copy-empty: "{prefix}&cHold an item in your main hand."
copy-value: "{prefix}&7Item Base64: &f{value}"
update-found: "{prefix}&eVersion &f{version} &eis available: &f{url}"
update-none: "{prefix}&aYou are running the latest version {version}."
update-staged: "{prefix}&aUpdate staged at &f{file}&a. Restart the server."
update-error: "{prefix}&cUpdate error: {error}"
reloaded: "{prefix}&apnRelog configuration reloaded."
reload-failed: "{prefix}&cConfiguration was not applied: {error}"
stats: "{prefix}&7Links: &f{links}&7, tagged players: &f{players}&7, pending: &f{pending}&7, circuit breaker: {circuit}"
circuit-opened: "{prefix}&eMass disconnect detected: penalties are temporarily suspended."
usage:
  - "&8&m----------&r &#E5484DpnRelog &8&m----------"
  - "&f/pnrelog status [player] &8- &7combat status"
  - "&f/pnrelog stats &8- &7system state"
  - "&f/pnrelog tag <player> [seconds] &8- &7single-player combat"
  - "&f/pnrelog tag <player1> <player2> [seconds] &8- &7start combat"
  - "&f/pnrelog clear <player|all> &8- &7clear combat"
  - "&f/pnrelog permit <player> [seconds] [reason] &8- &7allow transfer"
  - "&f/pnrelog history <player> [limit] &8- &7decision history"
  - "&f/pnrelog copy &8- &7get item Base64"
  - "&f/pnrelog update [check|install] &8- &7check/stage update"
  - "&f/pnrelog reload &8- &7reload configuration"
